<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Hot Shot Dashboard</title>
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <!-- ?v=… bei jeder Änderung erhöhen (gleiche Zahl wie in sw.js), damit Browser keine alte Datei aus dem Zwischenspeicher nehmen -->
  <link rel="stylesheet" href="../style.css?v=5">
  <link rel="stylesheet" href="dashboard.css?v=5">
  <script>
    // Gleiches Design wie in der App (Standard Dunkel)
    let t = 'dark';
    try { if (localStorage.getItem('schuetzen-theme') === 'light') t = 'light'; } catch (e) {}
    document.documentElement.dataset.theme = t;
  </script>
</head>
<body class="dash">
  <header class="dash-top">
    <div class="dash-brand">
      <img src="../icons/icon.svg" alt="" width="32" height="32">
      <span><b>Hot Shot</b> <span id="club-name">Vereins-Dashboard</span></span>
    </div>
    <!-- Am PC oben, am Handy als Leiste am unteren Rand (wie in der App) -->
    <nav class="dash-nav" id="dash-nav" hidden aria-label="Bereiche">
      <button type="button" data-view="ranking" class="active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/></svg>
        <span>Rangliste</span>
      </button>
      <button type="button" data-view="compare">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h16M7 15l4-5 3 3 5-7M7 18l4-3 3 1 5-4"/></svg>
        <span>Vergleich</span>
      </button>
      <button type="button" data-view="members">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14a6.5 6.5 0 0 1 3.5 6"/></svg>
        <span>Mitglieder</span>
      </button>
      <button type="button" data-view="club">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6l8-3z"/><circle cx="12" cy="11" r="3"/></svg>
        <span>Verein</span>
      </button>
    </nav>
    <div class="dash-user" id="dash-user"></div>
  </header>

  <main id="app" class="dash-main"></main>

  <!-- Nur am Handy: Name, Hell/Dunkel und Abmelden am Seitenende -->
  <footer class="dash-foot" id="dash-foot"></footer>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="../config.js?v=5"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../cloud.js?v=5"></script>
  <script src="dashboard.js?v=5"></script>
</body>
</html>
