<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Hot Shot Dashboard</title>
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <!-- ?v=… bei jeder Änderung erhöhen (gleiche Zahl wie in sw.js), damit Browser keine alte Datei aus dem Zwischenspeicher nehmen -->
  <link rel="stylesheet" href="../style.css?v=61">
  <link rel="stylesheet" href="dashboard.css?v=61">
  <script>
    // Gleiches Design wie in der App (Standard Dunkel)
    let t = 'dark';
    try { if (localStorage.getItem('schuetzen-theme') === 'light') t = 'light'; } catch (e) {}
    document.documentElement.dataset.theme = t;
  </script>
</head>
<body class="dash">
  <header class="dash-top">
    <div class="dash-brand">
      <img src="../icons/icon.svg" alt="" width="32" height="32">
      <span><b>Hot Shot</b> <span id="club-name">Vereins-Dashboard</span></span>
      <!-- Nur für Admins mehrerer Vereine -->
      <select id="club-switch" class="club-switch" aria-label="Verein wählen" hidden></select>
    </div>
    <!-- Am PC oben, am Handy als Leiste am unteren Rand (wie in der App) -->
    <nav class="dash-nav" id="dash-nav" hidden aria-label="Bereiche">
      <button type="button" data-view="ranking" class="active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/></svg>
        <span>Rangliste</span>
      </button>
      <button type="button" data-view="compare">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h16M7 15l4-5 3 3 5-7M7 18l4-3 3 1 5-4"/></svg>
        <span>Vergleich</span>
      </button>
      <button type="button" data-view="members">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14a6.5 6.5 0 0 1 3.5 6"/></svg>
        <span>Mitglieder</span>
      </button>
      <button type="button" data-view="club">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path stroke-linejoin="round" d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        <span>Optionen</span>
      </button>
    </nav>
  </header>

  <!-- Name, Hell/Dunkel und Abmelden stehen unten unter „Optionen“ -->
  <main id="app" class="dash-main"></main>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="../config.js?v=61"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../cloud.js?v=61"></script>
  <script src="../altersklassen.js?v=61"></script>
  <script src="dashboard.js?v=61"></script>
</body>
</html>
